name: Generate Test Release

# Makefile mapping: make bump-*-rc → version X.Y.Z-rcN → tag vX.Y.Z-rcN
# Creates a GitHub prerelease (not a draft) and publishes to TestPyPI.
# -devN tags do not trigger this workflow (local / in-repo WIP only).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build and upload to TestPyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build backend (hatch)
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build distribution (sdist + wheel)
        run: |
          hatch build

      # Trusted publishing to TestPyPI
      # Make sure you have added this GitHub repo as a "Trusted Publisher"
      # in your TestPyPI project settings.
      - name: Publish to TestPyPI via trusted publisher
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  generate-release-notes:
    name: Generate Release Notes
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-github-release-generator.yml@master
    with:
      draft: false
      prerelease: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - build-and-publish
      - generate-release-notes
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-summary.yml@master

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-notifier.yml@master
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
