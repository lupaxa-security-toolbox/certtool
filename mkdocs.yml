# =============================================================================
# Site Information
# =============================================================================

site_name: CertTool

site_description: >-
  Generate self-signed certificates, CSRs, and keys from CLI or Python.

site_author: The Lupaxa Project

site_url: https://certtool.thelupaxaproject.org/

repo_name: lupaxa-security-toolbox/certtool
repo_url: https://github.com/lupaxa-security-toolbox/certtool

extra:
  generator: false
  # Hide left site nav (header already lists pages); keep on-this-page TOC.
  # Default when omitted: false (left nav visible).
  hide_primary_sidebar: false
  # Short label for the header GitHub link (avoids org/repo crowding).
  repo_display_name: certtool
  # Footer (rendered by overrides/partials/copyright.html; year set in-browser).
  start_year: 2025
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  # Counter.dev analytics (omit counter_dev_id to disable).
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/social-media/social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: assets/images/logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs
site_dir: site
use_directory_urls: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.sections
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - Install: installation.md
  - Usage:
      - Overview: usage.md
      - CLI: cli.md
      - Examples: examples.md
  - Config: configuration.md
  - Security: security.md
  - Reference:
      - CLI: reference/cli.md
      - Config files: reference/config.md
      - Cert generation API: reference/certs.md
      - Example helpers: reference/example.md
      - Exceptions: reference/exceptions.md
      - Utils: reference/utils.md
      - Versioning: reference/version.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css
  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/tables.css
  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/header-active-nav.js

# =============================================================================
# Copyright (rendered by overrides/partials/copyright.html; year set in-browser)
# =============================================================================
